[project]
name = "thermal-core"
version = "0.1.0"
description = "Shared core library for the Thermal Lift project"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermal_core"]
