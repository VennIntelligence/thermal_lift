[project]
name = "ep11-dl-benchmark"
version = "0.1.0"
description = "EP11 — Zero-shot DL SR benchmark for thermal micro-scan data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ep07-unet-sr",
    "ep10-drizzle",
    "ipython>=8.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "thermal-core",
    "torch>=2.2",
    "tqdm>=4.60",
]

[tool.uv]
package = false

[tool.uv.sources]
ep07-unet-sr = { path = "../ep07_unet_sr", editable = true }
ep10-drizzle = { path = "../ep10_drizzle", editable = true }
thermal-core = { path = "../../core", editable = true }
tcforge = { path = "../../tcforge", editable = true }

[tool.pytest.ini_options]
pythonpath = ["../ep06_sr_poc/src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
