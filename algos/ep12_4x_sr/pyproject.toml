[project]
name = "ep12-4x-sr"
version = "0.1.0"
description = "EP12 drizzle-informed 4x thermal SR restoration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "tqdm>=4.66",
    "pytest>=8.0",
    "tensorboard>=2.15",
    "tcforge",
    "pandas>=3.0.3",
    "thermal-core",
]

[tool.uv]
package = true

[tool.uv.sources]
tcforge = { path = "../../tcforge", editable = true }
thermal-core = { path = "../../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sr4x"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
