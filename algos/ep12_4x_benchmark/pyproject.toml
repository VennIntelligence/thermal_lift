[project]
name = "ep12-4x-benchmark"
version = "0.1.0"
description = "EP12 4x UNet vs bare drizzle visual benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ep12-4x-sr",
    "ipython>=8.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "thermal-core",
    "torch>=2.2",
    "tqdm>=4.60",
    "tcforge",
]

[tool.uv]
package = false

[tool.uv.sources]
ep12-4x-sr = { path = "../ep12_4x_sr", editable = true }
thermal-core = { path = "../../core", editable = true }
tcforge = { path = "../../tcforge", editable = true }

[tool.pytest.ini_options]
pythonpath = ["../ep06_sr_poc/src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
