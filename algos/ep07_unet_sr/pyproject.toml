[project]
name = "ep07-unet-sr"
version = "0.1.0"
description = "EP07v2 learning-based 4x thermal super-resolution with compact TCForge scenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "torch>=2.2",
    "tqdm>=4.66",
    "pytest>=8.0",
    "tcforge",
    "thermal-core",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "pandas>=3.0.3",
]

[tool.uv]
package = true

[tool.uv.sources]
tcforge = { path = "../../tcforge", editable = true }
thermal-core = { path = "../../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unet_sr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
