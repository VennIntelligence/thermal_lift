model:
  name: wire
  hidden_features: 256
  hidden_layers: 4
  first_omega_0: 20.0
  hidden_omega_0: 20.0
  first_sigma_0: 10.0
  hidden_sigma_0: 10.0

data:
  scale: 2
  default_n_frames: 32
  default_patch_size_lr_px: 256

forward:
  # Optical PSF width in LR-pixel units for ForwardOperator.
  # Distinct from highpass_sigma_bg_lr_px below.
  psf_sigma_lr_px: 1.0

preprocess:
  # Gaussian background width in LR-pixel units for highpass observations.
  # This removes slow thermal background; it is not the optical PSF.
  highpass_sigma_bg_lr_px: 5.0

train:
  lr: 0.0005
  max_iter: 10000
  batch_k: 8
  warmup_steps: 200
  min_lr_factor: 0.05
  grad_clip_norm: 1.0
  val_interval: 100
  early_stop_patience: 1000
  early_stop_min_delta: 1.0e-6
  early_stop_min_steps: 500
  split_half_max_iter: 3000
  split_half_enabled: true
