model:
  name: siren
  hidden_features: 256
  hidden_layers: 4
  first_omega_0: 10.0
  hidden_omega_0: 10.0

data:
  scale: 2
  default_n_frames: 64
  patch_shape: full
  val_ratio: 0.2

coordinates:
  aspect_mode: preserve

forward:
  psf_sigma_lr_px: 1.0

preprocess:
  highpass_sigma_bg_lr_px: 8.0
  highpass_mode: nearest

train:
  lr: 0.0005
  max_iter: 15000
  batch_k: 8
  warmup_steps: 300
  min_lr_factor: 0.05
  grad_clip_norm: 1.0
  val_interval: 100
  early_stop_patience: 1500
  early_stop_min_delta: 1.0e-6
  early_stop_min_steps: 1000
  split_half_max_iter: 3000
  split_half_enabled: true

runtime:
  data_mode: real
  device: cuda:0
  workers: 1
  alignment_method: contour_refined
  output_dir: output/ep08_inr_sr/stage3/siren_064_full_preserve
